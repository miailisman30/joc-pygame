[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-engine-pygame"
version = "0.1.0"
description = "Simple Pygame boilerplate starter"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]
dependencies = [
  "pygame",
]

[tool.setuptools]
# Use explicit package list to avoid accidental inclusion
packages = ["game_engine_pygame"]
